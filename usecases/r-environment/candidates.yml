# Search space for the nightly research loop.
#
# ONE dimension per candidate. Two simultaneous changes produce a delta nobody
# can attribute, which defeats the purpose of running the experiment.
#
# Keep this list small (3-5 active candidates). The matrix multiplies across two
# tracks and consumes Actions minutes on every nightly run.

candidates:
  - id: ppm-2025-04-01
    track: renv
    dimension: ppm_snapshot
    value: "2025-04-01"
    rationale: >
      Quarterly CRAN snapshot advance. Tests whether three months of upstream
      package updates preserve ADSL/ADAE numeric outputs.

  - id: ppm-2025-07-01
    track: renv
    dimension: ppm_snapshot
    value: "2025-07-01"
    rationale: >
      Six-month advance. Expected to carry an admiral minor version bump, which
      is the most likely source of date-imputation drift in ADAE.

  - id: nixpkgs-2025-04-01
    track: nix
    dimension: nixpkgs_date
    value: "2025-04-01"
    rationale: >
      Track B counterpart to ppm-2025-04-01. Comparing the two answers whether
      the tracks agree about the effect of the same calendar advance.

  - id: base-digest-refresh
    track: renv
    dimension: base_digest
    value: "rocker/r-ver:4.4.2"
    rationale: >
      Digest pinning means base-image security patches never arrive on their
      own. This candidate re-resolves the tag and reports whether the digest
      moved, so the maintenance cost of pinning is visible rather than silent.

# Ranking policy for the weekly proposal. Order matters: a faster build never
# outweighs a change in results.
ranking:
  - result_stability      # layer 4 unchanged beats everything
  - pq_headroom           # distance between observed deviation and tolerance
  - low_delta_churn       # fewer moving parts is easier to review
  - build_time

# A candidate must clear ALL of these to be proposable.
gates:
  checks_failed_max: 0
  forbidden_verdicts:
    - FAIL_DEVIATION
    - FAIL_NONDETERMINISM
  # riskmetric's summarize_scores() returns a RISK score -- higher is worse.
  # This was written `riskmetric_min: 0.5`, which as a minimum gate would have
  # rejected the best-maintained packages and passed the worst. It never fired
  # because riskmetric was never installed, so the inversion was never exposed.
  #
  # Calibrated against a full scan of this environment, counting only packages
  # this repository chose (packages shipping with R are scored and reported but
  # excluded, since gating on them would block every candidate on properties of
  # R itself): median 0.51, dplyr 0.489, cli 0.503, admiral 0.554,
  # pharmaversesdtm 0.608. 0.7 sits above the observed spread with headroom,
  # so it catches a genuinely poorly-maintained addition without firing on the
  # pharmaverse stack as it stands.
  #
  # This threshold is a starting point, not a derived constant. It should move
  # on evidence from the research loop, in a PR that shows the distribution.
  package_risk_max: 0.7
