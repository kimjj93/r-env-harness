name: weekly-proposal

# The batching mechanism that protects your team's attention.
#
# The research loop may run hundreds of experiments a week. This workflow turns
# all of it into AT MOST ONE pull request. If nothing beat the incumbent it
# opens nothing at all -- a quiet week is a correct outcome, not a failure.
#
# It never merges. It opens a PR and stops.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Required by `gh run list` when measuring agent effectiveness. Without it
  # that step fails, and because it is continue-on-error the failure would be
  # invisible -- the metric would simply never appear. See the recurring
  # `silent-gate-degradation` lesson in AGENTS.md.
  actions: read

concurrency:
  group: weekly-proposal
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true

      - name: Install aggregation dependencies
        run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'

      - name: Collect the week's telemetry
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git fetch origin research/telemetry || true
          if git rev-parse --verify origin/research/telemetry >/dev/null 2>&1; then
            git show origin/research/telemetry:evidence/metrics/metrics.jsonl \
              > artifacts/metrics.jsonl 2>/dev/null || : > artifacts/metrics.jsonl
          else
            echo "::notice::No telemetry branch yet -- the research loop has not reported."
            : > artifacts/metrics.jsonl
          fi
          echo "rows: $(wc -l < artifacts/metrics.jsonl)"

      - name: Aggregate and select a candidate
        run: Rscript harness/research/aggregate.R artifacts/metrics.jsonl harness/research/candidates.yml artifacts

      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          REC=$(python3 -c "import json;print(json.load(open('artifacts/recommendation.json'))['recommendation'])")
          echo "recommendation=$REC" >> "$GITHUB_OUTPUT"
          echo "This week: $REC"

      - name: Generate the proposal and apply the pin
        id: propose
        if: steps.decide.outputs.recommendation == 'PROPOSE'
        run: |
          set -euo pipefail
          Rscript harness/research/propose.R artifacts/recommendation.json .
          # propose.R refuses to emit a pin edit for a candidate that matches
          # the incumbent, and says so here rather than opening an empty PR.
          CHANGED=$(python3 -c "import json;print(str(json.load(open('.proposal-status.json'))['changed']).lower())")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" != "true" ]; then
            REASON=$(python3 -c "import json;print(json.load(open('.proposal-status.json')).get('reason','n/a'))")
            echo "::notice::No pull request opened: $REASON"
          fi

      - name: Measure how well the instructions are working
        id: agentmetrics
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # The environment telemetry above says nothing about whether an agent
          # reading AGENTS.md could actually do the job. This does. It is
          # advisory: continue-on-error, because a measurement of the agents
          # must never be able to block a proposal about the environment.
          gh pr list --state all --limit 100 \
            --json number,author,headRefName,labels,title > artifacts/prs.json
          gh run list --workflow env-validate.yml --limit 300 \
            --json headBranch,conclusion,createdAt > artifacts/runs.json
          Rscript harness/agent_metrics.R artifacts/prs.json artifacts/runs.json artifacts >/dev/null
          cat artifacts/agent-metrics.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open exactly one pull request
        if: steps.decide.outputs.recommendation == 'PROPOSE' && steps.propose.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HARNESS_BOT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          ID=$(cat .proposal-id)
          BRANCH="proposal/$(date -u +%Y-%m-%d)-${ID}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          cp artifacts/weekly-summary.csv evidence/proposals/ 2>/dev/null || true
          # Carried into the proposal body so the human sees the environment
          # verdict and the agent-effectiveness figures in one read, rather
          # than in a dashboard nobody opens.
          PROPOSAL_MD="evidence/proposals/$(date -u +%Y-%m-%d)-${ID}.md"
          if [ -f artifacts/agent-metrics.md ] && [ -f "$PROPOSAL_MD" ]; then
            { echo; echo "---"; echo; cat artifacts/agent-metrics.md; } >> "$PROPOSAL_MD"
          fi
          if [ -f artifacts/agent-metrics.jsonl ]; then
            mkdir -p evidence/metrics
            cat artifacts/agent-metrics.jsonl >> evidence/metrics/agent-metrics.jsonl
          fi
          rm -f PROPOSAL.md .proposal-status .proposal-status.json .proposal-id

          git add -A
          # Belt and braces: even with the check above, never open a pull
          # request whose diff touches nothing outside evidence/. A proposal
          # that changes no environment pin is not a proposal.
          if git diff --cached --quiet -- . ':(exclude)evidence/'; then
            echo "::error::Proposal branch changes no environment pin. Refusing to open a review-consuming PR."
            exit 1
          fi
          git commit \
            -m "proposal($ID): weekly environment candidate" \
            -m "Selected by harness/research/aggregate.R from the last 7 days of unattended research telemetry. Full justification, metrics and rejected alternatives are in evidence/proposals/." \
            -m "Requires human review and approval before merge (GOVERNANCE.md)."

          git push origin "$BRANCH"

          BODY=$(cat "evidence/proposals/$(date -u +%Y-%m-%d)-${ID}.md")
          gh pr create \
            --base main --head "$BRANCH" \
            --title "Weekly environment proposal: $ID" \
            --body "$BODY" \
            --label "environment-proposal" \
            --label "needs-human-review"

      - name: Record a quiet week
        if: steps.decide.outputs.recommendation != 'PROPOSE' || steps.propose.outputs.changed != 'true'
        run: |
          if [ -f .proposal-status.json ]; then
            REASON=$(python3 -c "import json;print(json.load(open('.proposal-status.json')).get('reason','n/a'))")
          else
            REASON=$(python3 -c "import json;print(json.load(open('artifacts/recommendation.json')).get('reason','n/a'))")
          fi
          echo "::notice::No proposal opened this week. Reason: $REASON"
          echo "### No environment proposal this week" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Reason: \`$REASON\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The incumbent environment remains the best known configuration." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-aggregation-${{ github.run_id }}
          path: artifacts/
