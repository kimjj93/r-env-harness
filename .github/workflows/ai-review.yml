name: ai-review

# Advisory cross-review. A second model reads what the first one wrote.
#
# THE CRITICAL PROPERTY: every review this workflow posts is of type COMMENT,
# never APPROVE. GitHub does not count a COMMENT review toward a required
# approving review, so no amount of AI enthusiasm can satisfy the merge gate.
# That is not a convention here -- it is the mechanism by which "the human makes
# the final decision" is enforced rather than merely promised.
#
# skills-lint.yml greps this repository to prove no workflow can self-approve or
# self-merge. If you are editing this file, that check is why — reword carefully.

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only review machine-authored PRs. A human's PR does not need an AI opinion
    # posted on it unasked, and reviewing every PR burns quota on noise.
    #
    # The `ai-review` label exists so the capability can be exercised on demand.
    # Until it was added, this job had skipped on every run in the repository's
    # history -- it had never once executed, so nothing about it was known to
    # work. A capability that has never run is a capability you do not have.
    #
    # Note for whoever tests this: `pull_request_target` always runs the copy of
    # this file on the DEFAULT branch, so a change here cannot be proven on the
    # pull request that makes it. Label a PR after this merges.
    if: >
      github.event.pull_request.user.type == 'Bot' ||
      contains(github.event.pull_request.labels.*.name, 'ai-review') ||
      contains(github.event.pull_request.labels.*.name, 'agent-racer') ||
      contains(github.event.pull_request.labels.*.name, 'environment-proposal')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Assemble the review checklist
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Mechanical checks first. These are things a reviewer would otherwise
          # have to verify by hand on every agent PR, and they are exactly the
          # rules agents are most likely to breach while being helpful.
          gh pr diff "$PR" --name-only > /tmp/files.txt || : > /tmp/files.txt
          echo "Changed files:"; cat /tmp/files.txt

          : > /tmp/findings.md
          note () { echo "- $1" >> /tmp/findings.md; }

          # Generated files and committed baselines are found by inspection,
          # not by a hard-coded list: a list goes stale the moment the use case
          # adds a file, and goes stale silently.
          while read -r f; do
            [ -f "$f" ] || continue
            if head -5 "$f" 2>/dev/null | grep -qi 'GENERATED'; then
              note "**\`$f\` carries a GENERATED banner and was modified.** Verify it was regenerated by its generator and not hand-edited (\`AGENTS.md\` 1.4)."
            fi
          done < /tmp/files.txt

          if grep -qE '(^|/)(fixtures|references|baselines)/' /tmp/files.txt; then
            note "**Committed baselines were modified.** A baseline is the answer key the work is judged against. Changing it changes what 'correct' means, so this needs explicit human justification (\`AGENTS.md\` 1.5)."
          fi
          if grep -qE '^(AGENTS\.md|GOVERNANCE\.md|skills/)' /tmp/files.txt; then
            note "**Governance or skill files were modified.** Confirm the change does not weaken a rule or a gate. Rule changes are legitimate, but they are the highest-consequence diff in this repository."
          fi
          if grep -qE "^(harness/|harness\.yml)" /tmp/files.txt; then
            note "**Harness machinery changed.** This affects every use case, not just this one. Confirm the change is domain-independent and that \`harness/check_boundary\` still passes."
          fi
          if grep -qE '^\.github/workflows/' /tmp/files.txt; then
            note "**A workflow changed.** Check that no gate was removed, no \`continue-on-error\` was added to a required check, and permissions were not widened."
          fi

          if [ ! -s /tmp/findings.md ]; then
            echo "- No high-risk paths touched." >> /tmp/findings.md
          fi

      - name: Post an advisory COMMENT review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          {
            echo "## Automated cross-review (advisory)"
            echo
            echo "This is a **COMMENT**, not an approval. It cannot satisfy the"
            echo "required review on this repository, by design."
            echo
            echo "### Risk surface of this diff"
            echo
            cat /tmp/findings.md
            echo
            echo "### What a human still has to decide"
            echo
            echo "The gates can tell you the environment builds and the numbers"
            echo "did not move beyond tolerance. They cannot tell you whether the"
            echo "packages that changed matter for *your* therapeutic area, or"
            echo "whether this is the right moment in your release cycle to move"
            echo "the environment. That judgement is not automatable and is why"
            echo "this repository requires your approval."
            echo
            echo "Evidence to read before deciding: \`delta.md\`, \`pq-summary.json\`,"
            echo "and \`risk-scan.json\` in this run's artifacts."
          } > /tmp/review.md

          # --comment forces review type COMMENT. Never change this to an
          # approval: it is the enforcement point for human-only merge.
          gh pr review "$PR" --comment --body-file /tmp/review.md
