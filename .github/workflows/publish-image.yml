name: publish-image

# Publishes signed, immutable images to GHCR — but ONLY after a human has
# merged to main. A PR can build an image; it can never publish one. That
# ordering is what makes the registry a trustworthy record: every published
# digest corresponds to a commit some human approved.

on:
  push:
    branches: [main]
    paths:
      - 'env/**'
      - 'analysis/**'
      - 'validation/**'
      - 'harness/**'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

permissions:
  contents: write      # to commit the digest lock back
  packages: write      # to push to GHCR
  id-token: write      # for cosign keyless signing
  attestations: write

concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pins
        id: pin
        run: |
          set -euo pipefail
          echo "snapshot=$(grep '^PPM_SNAPSHOT=' env/renv/ppm-snapshot.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "nixdate=$(grep '^NIXPKGS_DATE=' env/nix/nixpkgs-pin.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Track A
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: env/renv/Dockerfile
          build-args: |
            PPM_SNAPSHOT=${{ steps.pin.outputs.snapshot }}
          # Tagged by commit SHA, never 'latest', so an image maps 1:1 to a
          # reviewed commit and can never be silently replaced.
          tags: ${{ env.IMAGE_BASE }}/renv:${{ github.sha }}
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=renv
          cache-to: type=gha,mode=max,scope=renv

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        run: |
          set -euo pipefail
          # Keyless OIDC signing: provenance without key management.
          cosign sign --yes \
            "${{ env.IMAGE_BASE }}/renv@${{ steps.push.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_BASE }}/renv@${{ steps.push.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-renv.spdx.json
          output-file: sbom-renv.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE_BASE }}/renv
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Extract and archive the environment manifest
        run: |
          set -euo pipefail
          mkdir -p evidence/manifests
          docker run --rm \
            -e HARNESS_TRACK=renv \
            -e PPM_SNAPSHOT=${{ steps.pin.outputs.snapshot }} \
            -v "${{ github.workspace }}/evidence/manifests:/out" \
            "${{ env.IMAGE_BASE }}/renv@${{ steps.push.outputs.digest }}" \
            Rscript /project/harness/image_manifest.R /out/renv-${{ github.sha }}.json
          cp "evidence/manifests/renv-${{ github.sha }}.json" \
             "evidence/manifests/renv-latest.json"

      - name: Run PQ inside the published image and archive results
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts evidence/metrics
          docker run --rm \
            -e ARTIFACT_DIR=/project/artifacts \
            -v "${{ github.workspace }}/artifacts:/project/artifacts" \
            "${{ env.IMAGE_BASE }}/renv@${{ steps.push.outputs.digest }}" \
            Rscript /project/validation/run-validation.R
          cp artifacts/pq-summary.json evidence/metrics/pq-renv-latest.json

      - name: Update the digest lock
        run: |
          set -euo pipefail
          # images.lock.json is the bridge between "the code we reviewed" and
          # "the bits that ran". It is what makes the evidence chain in
          # skills/submission-evidence/SKILL.md resolvable years later.
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("env/images/images.lock.json")
          data = json.loads(p.read_text()) if p.exists() else {"images": {}}
          sha = os.environ["GITHUB_SHA"]
          data["images"][sha] = {
              "renv": {
                  "repository": os.environ["IMAGE_BASE"] + "/renv",
                  "digest": os.environ["DIGEST"],
                  "ppm_snapshot": os.environ["SNAPSHOT"],
                  "base_digest": os.environ["BASE_DIGEST"],
                  "signed": True,
              }
          }
          data["current"] = sha
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          print("locked", sha, os.environ["DIGEST"])
          PY
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SNAPSHOT: ${{ steps.pin.outputs.snapshot }}
          IMAGE_BASE: ${{ env.IMAGE_BASE }}
          BASE_DIGEST: sha256:df26749182af64d5263bf64149d51a427b476ed28c4e046997143be3f97fdd7c

      - name: Commit evidence
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: lock image digest and archive manifest for ${{ github.sha }} [skip ci]"
          file_pattern: "env/images/images.lock.json evidence/manifests/*.json evidence/metrics/*.json"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Summary
        run: |
          {
            echo "## Published image"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| repository | \`${{ env.IMAGE_BASE }}/renv\` |"
            echo "| digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| PPM snapshot | ${{ steps.pin.outputs.snapshot }} |"
            echo "| signed | cosign keyless |"
            echo ""
            echo "Pull by digest (immutable):"
            echo '```'
            echo "docker pull ${{ env.IMAGE_BASE }}/renv@${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
