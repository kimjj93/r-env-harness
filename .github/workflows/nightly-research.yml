name: nightly-research

# The autopilot. Explores candidate environment upgrades every night and records
# what happened.
#
# Two properties make this tolerable to run continuously:
#   1. It NEVER opens a pull request and NEVER targets main. Findings go to the
#      research/telemetry branch, so hundreds of experiments cost zero review time.
#   2. Failures are expected and are the point. A candidate that breaks PQ is a
#      discovery made cheaply at night instead of expensively during a release.

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC nightly
  workflow_dispatch:
    inputs:
      candidate_id:
        description: 'Run a single candidate by id (blank = all)'
        required: false
        default: ''

permissions:
  contents: write   # only to push telemetry to research/telemetry

concurrency:
  group: nightly-research
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet pyyaml

      - name: Ask the use case what it is willing to vary
        id: build
        run: |
          set -euo pipefail
          # The harness does not decide what to experiment on. It asks. An
          # autonomous loop that can choose its own variables will eventually
          # vary something nobody agreed it should touch.
          ./harness/usecase run candidates > /tmp/candidates.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          items = json.load(open("/tmp/candidates.json"))
          wanted = os.environ.get("ONLY", "").strip()
          if wanted:
              items = [i for i in items if i["id"] == wanted]
          print("matrix=" + json.dumps({"include": items}))
          PY
          cat /tmp/candidates.json
        env:
          ONLY: ${{ github.event.inputs.candidate_id }}

  research:
    needs: plan
    runs-on: ubuntu-latest
    # A failing candidate is DATA, not an incident. Without this the loop would
    # stop exploring the moment it found something interesting.
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      RESEARCH_DIMENSION: ${{ matrix.dimension }}
      RESEARCH_CANDIDATE: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install --quiet pyyaml

      - name: Apply the candidate value
        run: |
          set -euo pipefail
          # The candidate carries its own environment variables, named by the
          # use case. The harness copies them across without knowing what any
          # of them mean.
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          env = json.loads(os.environ["CANDIDATE_ENV"] or "{}")
          for k, v in env.items():
              print(f"{k}={v}")
          PY
          echo "Candidate ${{ matrix.id }}: ${{ matrix.dimension }} -> ${{ matrix.value }}"
        env:
          CANDIDATE_ENV: ${{ toJSON(matrix.env) }}

      - name: Build
        id: build
        continue-on-error: true
        run: ./harness/usecase run build "${{ matrix.variant }}"

      - name: Qualify
        id: qualify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: ./harness/usecase run qualify "${{ matrix.variant }}"

      - name: Delta
        id: delta
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: ./harness/usecase run delta "${{ matrix.variant }}"

      - name: Collect the row
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Every candidate produces a row, including one that never built.
          # "This candidate does not build" is exactly the kind of finding the
          # loop exists to surface, and a missing row looks like a bug instead.
          if [ -s evidence/metrics/metrics.jsonl ]; then
            tail -n 1 evidence/metrics/metrics.jsonl > artifacts/metrics-row.json
          else
            printf '{"timestamp":"%s","candidate_id":"%s","variant":"%s","dimension":"%s","verdict":"NOT_EVALUATED","build_outcome":"%s"}\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ matrix.id }}" \
              "${{ matrix.variant }}" "${{ matrix.dimension }}" \
              "${{ steps.build.outcome }}" > artifacts/metrics-row.json
          fi

          # Stamp the row with the three facts only this job knows, and which
          # the weekly aggregator requires to turn a row into a proposal:
          #
          #   candidate_value  what was actually tested. Without it the
          #                    aggregator cannot write an edit into a pin file,
          #                    so it correctly refuses the candidate as "not
          #                    actionable" -- which is how every candidate was
          #                    silently rejected for the entire life of the loop.
          #   status           whether this experiment is usable evidence.
          #   timestamp        one canonical format. The use case writes
          #                    isoformat() with microseconds and an offset; the
          #                    aggregator's window filter reads a bare `...Z`.
          #
          # The use case is not asked to supply these: it does not know which
          # candidate the harness chose, and a domain should not have to learn
          # the harness's schema to be scheduled by it.
          python3 - <<'PY'
          import json, os, datetime
          p = "artifacts/metrics-row.json"
          row = json.load(open(p))
          row["candidate_value"] = os.environ["CANDIDATE_VALUE"]
          build, qualify = os.environ["BUILD_OUTCOME"], os.environ["QUALIFY_OUTCOME"]
          # Only a candidate that built AND qualified is evidence about the
          # environment. Anything else is evidence about the candidate, which is
          # still worth recording but must never be proposable.
          row["status"] = "success" if build == "success" and qualify == "success" else "failed"
          row["build_outcome"], row["qualify_outcome"] = build, qualify
          row["timestamp"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          json.dump(row, open(p, "w"))
          PY

          cp -r evidence/delta evidence/qualify artifacts/ 2>/dev/null || true
          cat artifacts/metrics-row.json
        env:
          CANDIDATE_VALUE: ${{ matrix.value }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          QUALIFY_OUTCOME: ${{ steps.qualify.outcome }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-${{ matrix.id }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore

  telemetry:
    needs: research
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: research-*

      - name: Append rows to the telemetry branch
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Telemetry lives on its own branch and NEVER on main. This is what
          # keeps the research loop's review cost at exactly zero.
          git fetch origin research/telemetry || true
          if git rev-parse --verify origin/research/telemetry >/dev/null 2>&1; then
            git checkout -B research/telemetry origin/research/telemetry
          else
            git checkout --orphan research/telemetry
            git rm -rf --cached . >/dev/null 2>&1 || true
            rm -rf $(ls -A | grep -v '^\.git$' | grep -v '^incoming$') 2>/dev/null || true
            mkdir -p evidence/metrics
            echo "Telemetry branch for the nightly research loop. Never merged into main." > README.md
          fi

          mkdir -p evidence/metrics
          touch evidence/metrics/metrics.jsonl
          found=0
          for f in $(find incoming -name 'metrics-row.json' 2>/dev/null); do
            cat "$f" >> evidence/metrics/metrics.jsonl
            found=$((found+1))
          done
          echo "Appended $found metrics row(s)."

          rm -rf incoming
          git add -A evidence/metrics/metrics.jsonl README.md
          git commit -m "chore(research): telemetry for run ${{ github.run_id }}" || {
            echo "Nothing to record."; exit 0; }
          git push origin research/telemetry
