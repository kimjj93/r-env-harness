name: build-fixtures

# PHASE 1 — regenerate the reference fixtures, in CI, inside the validated image.
#
# Why this must be a workflow and not something a person runs locally:
# a fixture IS the definition of "correct" for this repository. Its provenance
# has to be attributable to a specific commit, a specific image, and a specific
# runner architecture. A baseline built on someone's laptop cannot be audited,
# and — because BLAS and CPU architecture decide the last bits of every
# floating-point result — a laptop-built baseline will not even reproduce on CI.
#
# This workflow never writes to main. It opens a pull request, because
# redefining "correct" is exactly the kind of change a human must approve.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are the baselines being redefined? (goes in the PR body)"
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-fixtures
  cancel-in-progress: false

jobs:
  fixtures:
    name: Rebuild reference fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve snapshot pin
        id: pin
        run: |
          set -euo pipefail
          SNAP=$(grep '^PPM_SNAPSHOT=' usecases/r-environment/env/renv/ppm-snapshot.txt | cut -d= -f2)
          echo "snapshot=$SNAP" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: usecases/r-environment/env/renv/Dockerfile
          build-args: |
            PPM_SNAPSHOT=${{ steps.pin.outputs.snapshot }}
          tags: r-env-harness/renv:fixtures
          push: false
          load: true
          cache-from: type=gha,scope=renv

      - name: Record the exact environment that produced the baselines
        id: prov
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run --rm \
            -v "${{ github.workspace }}/artifacts:/project/artifacts" \
            r-env-harness/renv:fixtures \
            Rscript /project/usecases/r-environment/bin/image_manifest.R /project/artifacts/fixture-env-manifest.json
          RVER=$(docker run --rm r-env-harness/renv:fixtures \
            Rscript -e 'cat(as.character(getRversion()))')
          ARCH=$(docker run --rm r-env-harness/renv:fixtures \
            Rscript -e 'cat(R.version$platform)')
          BLAS=$(docker run --rm r-env-harness/renv:fixtures \
            Rscript -e 'cat(basename(sessionInfo()$BLAS %||% "unknown"))' 2>/dev/null || echo unknown)
          echo "rver=$RVER" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "blas=$BLAS" >> "$GITHUB_OUTPUT"

      - name: Generate fixtures inside the image
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}/validation/fixtures:/project/validation/fixtures" \
            r-env-harness/renv:fixtures \
            Rscript /project/validation/build-fixtures.R
          # The container writes as root; hand the files back to the runner user
          # so the checkout action can commit them.
          sudo chown -R "$(id -u):$(id -g)" usecases/r-environment/validation/fixtures

      - name: Verify the new baselines validate strictly
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run --rm \
            -e ARTIFACT_DIR=/project/artifacts \
            -e HARNESS_TRACK=renv \
            -v "${{ github.workspace }}/validation/fixtures:/project/validation/fixtures" \
            -v "${{ github.workspace }}/artifacts:/project/artifacts" \
            r-env-harness/renv:fixtures \
            Rscript /project/validation/run-validation.R
          # A freshly built baseline that does not reproduce in the very image
          # that produced it means the payload is non-deterministic. That is a
          # defect in the analysis code, not a reason to relax the comparison.

      - name: Summarise the strict/tolerant split
        id: split
        run: |
          set -euo pipefail
          STRICT=$(jq -r '.strict' artifacts/pq-summary.json)
          TOLERANT=$(jq -r '.tolerant' artifacts/pq-summary.json)
          echo "strict=$STRICT" >> "$GITHUB_OUTPUT"
          echo "total=$((STRICT + TOLERANT))" >> "$GITHUB_OUTPUT"
          # A rebuild that lands on the tolerant path has failed at its own job:
          # the baseline is supposed to have been made by this exact image.
          if [ "$TOLERANT" -ne 0 ]; then
            echo "::warning::${TOLERANT} assertion(s) took the tolerant path in the image that just produced the baselines. The environment fingerprint is not matching itself — investigate before merging."
          fi

      - name: Open a pull request with the regenerated baselines
        env:
          GH_TOKEN: ${{ secrets.HARNESS_BOT_TOKEN || github.token }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if git diff --quiet -- usecases/r-environment/validation/fixtures; then
            echo "::notice::Fixtures are byte-identical to the committed ones. Nothing to propose."
            exit 0
          fi
          BRANCH="fixtures/rebuild-${GITHUB_RUN_ID}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add usecases/r-environment/validation/fixtures
          git commit \
            -m "evidence(fixtures): regenerate reference baselines in CI" \
            -m "Built inside r-env-harness/renv at ${GITHUB_SHA} on ${{ steps.prov.outputs.arch }}." \
            -m "Reason: ${REASON}"
          git push origin "$BRANCH"
          {
            echo "## Regenerated reference fixtures"
            echo
            echo "**This PR redefines what \"correct\" means for this repository.**"
            echo "Read the diff as a change to the acceptance criteria, not as data."
            echo
            echo "| Provenance | Value |"
            echo "|---|---|"
            echo "| Source commit | \`${GITHUB_SHA}\` |"
            echo "| Built by | run [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo "| R version | ${{ steps.prov.outputs.rver }} |"
            echo "| Platform | \`${{ steps.prov.outputs.arch }}\` |"
            echo "| BLAS | \`${{ steps.prov.outputs.blas }}\` |"
            echo "| PPM snapshot | ${{ steps.pin.outputs.snapshot }} |"
            echo
            echo "### Reason given"
            echo
            echo "> ${REASON}"
            echo
            echo "### Self-check"
            echo
            echo "The new baselines were re-validated in the same image that produced them:"
            echo "**${{ steps.split.outputs.strict }} of ${{ steps.split.outputs.total }} assertions took the strict (exact) path.**"
            echo "A strict pass here is the minimum bar — anything less means the analysis payload is not deterministic."
            echo
            echo "### Reviewer checklist"
            echo
            echo "- [ ] The reason above is a legitimate cause to move the baseline"
            echo "- [ ] The numeric changes in the diff are explained by that reason"
            echo "- [ ] No fixture was hand-edited (\`AGENTS.md\` §1.5)"
          } > pr-body.md
          # A PR opened with GITHUB_TOKEN does not trigger `pull_request`
          # workflows — GitHub blocks that to prevent recursive runs. The gate
          # then never reports, and the PR is unmergeable rather than
          # unvalidated (fail-closed). Say so in the PR itself, because a PR
          # showing no checks is otherwise easy to misread as "nothing to run".
          if [ -z "${{ secrets.HARNESS_BOT_TOKEN }}" ]; then
            {
              echo
              echo "---"
              echo
              echo "> [!WARNING]"
              echo "> **This PR was opened with \`GITHUB_TOKEN\`, so \`env-validate\` did not start.**"
              echo "> GitHub suppresses workflow triggers from \`GITHUB_TOKEN\` to prevent recursion."
              echo "> The required checks are *missing*, not passing — the PR is blocked, not approved."
              echo ">"
              echo "> To run the gate: **close and reopen this PR**, which re-triggers it as a human action."
              echo "> To fix permanently: set a \`HARNESS_BOT_TOKEN\` secret (see \`GOVERNANCE.md\` §2)."
            } >> pr-body.md
          fi
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "evidence(fixtures): regenerate reference baselines in CI" \
            --body-file pr-body.md \
            --label needs-human-review

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-rebuild-evidence
          path: |
            artifacts/
          if-no-files-found: warn
